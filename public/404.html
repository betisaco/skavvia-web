<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>SKAVVIA — Keşfet. Paylaş. İz Bırak.</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirection
      // MIT License - https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0; // 0 for custom root domain skavvia.com
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; background-color: #08130F; color: #F5F5F0;">
      <h1 style="font-size: 24px; margin-bottom: 8px;">Yönlendiriliyor...</h1>
      <p style="color: #6B7280;">Sayfa yüklenirken lütfen bekleyin.</p>
    </div>
  </body>
</html>
